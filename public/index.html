<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Premium Shoes & Bags</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="main-header">
    <div class="container">
      <h1 class="logo">My Shop</h1>
      <p class="tagline">Premium Shoes & Bags</p>
    </div>
  </header>

  <main class="container">
    <div class="filter-section">
      <button class="filter-btn active" data-category="all">All Products</button>
      <button class="filter-btn" data-category="shoes">Shoes</button>
      <button class="filter-btn" data-category="bags">Bags</button>
      <button class="filter-btn" data-category="accessories">Accessories</button>
    </div>

    <div id="products-container" class="products-grid">
      <div class="loading">Loading products...</div>
    </div>

    <div id="no-products" class="no-products" style="display: none;">
      <p>No products available yet. Check back soon!</p>
    </div>
  </main>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2024 My Shop. All rights reserved.</p>
      <p><a href="admin.html">Admin Login</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
